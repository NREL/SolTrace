# NOTE: the wheel expects the cmake build process to be run before running `py -m build --wheel`
[build-system]
requires = ["hatchling == 1.26"]
build-backend = "hatchling.build"

[project]
name = "nvsoltrace"
version = "0.0.1"
description = "NVIDIA Optix plugin for PySolTrace, the python bindings for the NLR SolTrace(TM) ray-tracing engine."
readme = "./README.md"
license-files = ["LICENSE.md"]
keywords = ["SolTrace", "Concentrating Solar", "CSP", "CST"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics"
]
requires-python = ">=3.10"
dependencies = [
    "hatchling >= 1.32.4",
]

[project.urls]
Homepage = "https://github.com/NLR-SolTrace/SolTrace"
Documentation = "https://github.com/NLR-SolTrace/SolTrace#readme"
Repository = "https://github.com/NLR-SolTrace/SolTrace.git"
"Bug Tracker" = "https://github.com/NLR-SolTrace/SolTrace/issues"

[tool.hatch.build.targets.sdist]
include = ["nvsoltrace"]

[tool.hatch.build.targets.wheel]
# include build artifacts in wheel target
artifacts = ["nvsoltrace/bin/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "nvsoltrace/_whl_tag.py"
