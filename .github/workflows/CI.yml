# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ develop, optix_CI_dummy ]
  pull_request:
    branches: [ develop, optix_CI_dummy ]

jobs:
  gpu-build:
    runs-on: gpu-runner

    env:
      BUILD_TYPE: Release
      C_COMPILER: gcc
      CXX_COMPILER: g++

    steps:
    - uses: actions/checkout@v4

    - name: Inspect runner
      run: |
        echo "Runner OS: $RUNNER_OS"
        echo "Runner arch: $RUNNER_ARCH"
        echo "Runner name: $RUNNER_NAME"
        echo "Runner temp: $RUNNER_TEMP"
        echo "Runner tool cache: $RUNNER_TOOL_CACHE"
        echo "Workspace: $GITHUB_WORKSPACE"

        echo ""
        echo "OS release:"
        cat /etc/os-release || true
        uname -a || true

        echo ""
        echo "CPU:"
        lscpu || true

        echo ""
        echo "Memory:"
        free -h || true

        echo ""
        echo "Disk:"
        df -h || true

        echo ""
        echo "Compilers and CMake:"
        command -v gcc || true
        gcc --version || true
        command -v g++ || true
        g++ --version || true
        command -v clang || true
        clang --version || true
        command -v cmake || true
        cmake --version || true

        echo ""
        echo "GPU and CUDA:"
        command -v nvidia-smi || true
        nvidia-smi || true
        command -v nvcc || true
        nvcc --version || true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libembree-dev

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ env.CXX_COMPILER }}
        -DCMAKE_C_COMPILER=${{ env.C_COMPILER }}
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DSOLTRACE_BUILD_GUI=OFF
        -DSOLTRACE_BUILD_EMBREE_SUPPORT=ON
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ env.BUILD_TYPE }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
        cd ${{ steps.strings.outputs.build-output-dir }}/google-tests
        ctest --output-on-failure --build-config ${{ env.BUILD_TYPE }} -VV
