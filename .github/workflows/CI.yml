# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        build_type: [Release, RelWithDebInfo]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macOS-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macOS-latest
            c_compiler: gcc
            cpp_compiler: g++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macOS-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v5
  
    - name: Install lfontconfig
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev

    - name: Install embree (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libembree-dev

    - name: Install embree (macOS)
      if: matrix.os == 'macOS-latest'
      run: |
        brew install embree

    - name: Install embree (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $embreeVersion = "4.4.0"
        $embreeUrl = "https://github.com/embree/embree/releases/download/v$embreeVersion/embree-$embreeVersion.x64.windows.zip"
        $embreeZip = "$env:TEMP\embree.zip"
        $embreeDir = "C:\embree"
        
        Write-Host "Downloading Embree $embreeVersion..."
        Invoke-WebRequest -Uri $embreeUrl -OutFile $embreeZip
        
        Write-Host "Extracting Embree..."
        Expand-Archive -Path $embreeZip -DestinationPath $embreeDir -Force
        
        # $embreeRoot = Get-ChildItem -Path $embreeDir -Directory -Filter "embree*" | Select-Object -First 1
        $embreeCMake = Join-Path $embreeDir "lib\cmake\embree-$embreeVersion"
        $embreeLib = Join-Path $embreeDir "bin"
        
        # Write-Host "Embree root: $($embreeRoot.FullName)"
        Write-Host "Embree CMake: $embreeCMake"
        Write-Host "Embree Lib: $embreeLib"
        
        echo "embree_DIR=$embreeCMake" >> $env:GITHUB_ENV
        echo "$embreeLib" >> $env:GITHUB_PATH

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DSOLTRACE_BUILD_GUI=OFF
        -DSOLTRACE_BUILD_EMBREE_SUPPORT=ON
        -DSOLTRACE_BUILD_API=ON
        -S ${{ github.workspace }}

    - name: Build-Windows
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      if: matrix.os == 'windows-latest'
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}
      
    - name: Build-Mac-Linux
      if: matrix.os != 'windows-latest'
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    # - name: List test directory
    #   run: |
    #       dir build/google-tests
          

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: |
        cd ${{ steps.strings.outputs.build-output-dir }}/google-tests
        ctest --output-on-failure --build-config ${{ matrix.build_type }} -VV

  # New Dedicated GPU Run Job (Runs in parallel with the CPU Matrix)
  build-gpu:
    name: build-gpu (ubuntu-24.04-gpu, Release, gcc, OptiX)
    # cross-compile windows - sudo apt install gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 -> x86_64-w64-mingw32-gcc/x86_64-w64-mingw32-g++
    runs-on: gpu-runner
    container:
      image: ghcr.io/nlr-soltrace/soltrace-build-env:latest
      options: --gpus all
      env:
        NVIDIA_DRIVER_CAPABILITIES: all
        CUDA_CACHE_PATH: /tmp
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y libembree-dev

      - name: Configure SolTrace
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSOLTRACE_BUILD_OPTIX_SUPPORT=ON \
            -DSOLTRACE_BUILD_GUI=OFF \
            -DSOLTRACE_BUILD_API=ON \
            -DSOLTRACE_BUILD_EMBREE_SUPPORT=ON \
            -DSAMPLES_PTX_DIR="$GITHUB_WORKSPACE/build/lib/ptx" \
            -DFULL_FIELD_VALIDATION_TEST=OFF \
            -DSOLTRACE_BUILD_PERF_TEST=ON \
            -S .

      - name: Build SolTrace
        run: cmake --build build -j4

      - name: Test GPU Build
        working-directory: ./build
        # Runs the entire test suite, natively using the GPU!
        run: ctest --output-on-failure --build-config Release -VV

      # TODO: step to build wheel use 3.14 (pip install build) actions/setup-python@v5
      #       python -m build --wheel \
      #         -Ccmake.define.SOLTRACE_BUILD_EMBREE_SUPPORT="ON" \
      #         -Ccmake.define.SOLTRACE_BUILD_OPTIX_SUPPORT="ON"
      #
      #       step to install wheel and test it in a venv
      #       - something like, maybe bsh?
      #           cd coretrace/stapi_v2 # maybe working-directory: ./coretrace/stapi_v2
      #           rm -rf venv if exists
      #           python -m venv venv
      #           source venv/bin/activate
      #           pip install dist/*.whl --force-reinstall
      #           python ./testing.py -v
      #
      #       step to reinstall python 3.13 -> note: actions/setup-python@v5 rewrites the PATH to use the new python version
      #       step to install wheel and test it in a venv
      #       step to reinstall python 3.12
      #       step to install wheel and test it in a venv
      #       step to reinstall python 3.11
      #       step to install wheel and test it in a venv
      #       step to reinstall python 3.10
      #       step to install wheel and test it in a venv

  # job to build pysoltrace wheel on different OSs, only run if the build job succeeds, i.e. the tests pass
  build-wheel:
    needs: build

    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain>
      # 2. <Linux, Release, latest GCC compiler toolchain>
      # 3. <macOS, Release, latest GCC compiler toolchain>

      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        c_compiler: [gcc, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: macOS-latest
            c_compiler: gcc
            cpp_compiler: g++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: ubuntu-latest
            c_compiler: cl
          - os: macOS-latest
            c_compiler: cl
    
    steps:
    - uses: actions/checkout@v5
  
    # same install steps as the build job
    # - name: Install lfontconfig
    #   if: matrix.os == 'ubuntu-latest'
    #   run: |
    #     sudo apt-get update
    #     sudo apt-get install -y libfontconfig1-dev

    - name: Install embree (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libembree-dev

    - name: Install embree (macOS)
      if: matrix.os == 'macOS-latest'
      run: |
        brew install embree

    - name: Install embree (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $embreeVersion = "4.4.0"
        $embreeUrl = "https://github.com/embree/embree/releases/download/v$embreeVersion/embree-$embreeVersion.x64.windows.zip"
        $embreeZip = "$env:TEMP\embree.zip"
        $embreeDir = "C:\embree"
        
        Write-Host "Downloading Embree $embreeVersion..."
        Invoke-WebRequest -Uri $embreeUrl -OutFile $embreeZip
        
        Write-Host "Extracting Embree..."
        Expand-Archive -Path $embreeZip -DestinationPath $embreeDir -Force
        
        # $embreeRoot = Get-ChildItem -Path $embreeDir -Directory -Filter "embree*" | Select-Object -First 1
        $embreeCMake = Join-Path $embreeDir "lib\cmake\embree-$embreeVersion"
        $embreeLib = Join-Path $embreeDir "bin"
        
        # Write-Host "Embree root: $($embreeRoot.FullName)"
        Write-Host "Embree CMake: $embreeCMake"
        Write-Host "Embree Lib: $embreeLib"
        
        echo "embree_DIR=$embreeCMake" >> $env:GITHUB_ENV
        echo "$embreeLib" >> $env:GITHUB_PATH
    
    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "py-bin-dir=${{ github.workspace }}/api/pysoltrace/pysoltrace/bin/" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -DSOLTRACE_BUILD_GUI=OFF
        -DSOLTRACE_BUILD_EMBREE_SUPPORT=ON
        -DSOLTRACE_BUILD_API=ON
        -DSOLTRACE_BUILD_TESTS=OFF
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # if: matrix.os == 'windows-latest'
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

    # - name: Build-Mac-Linux
    #   if: matrix.os != 'windows-latest'
    #   run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release
    
    # binaries copied in post build step on windows
    # - name: Get Binaries (Windows)
    #   if: matrix.os == 'windows-latest'
    #   run: |
    #     cp ${{ steps.strings.outputs.build-output-dir }}/coretrace/simdriver/Release/simdriver.exe ${{ steps.strings.outputs.py-bin-dir }}
    #     cp ${{ steps.strings.outputs.build-output-dir }}/api/Release/stapi_v2.dll ${{ steps.strings.outputs.py-bin-dir }}

        # ls -ld ${{ steps.strings.outputs.py-bin-dir }}
        # file ${{ steps.strings.outputs.py-bin-dir }}
        # git ls-files -s ${{ steps.strings.outputs.py-bin-dir }}
        # ls ${{ steps.strings.outputs.build-output-dir }}/coretrace/simdriver
        # ls ${{ steps.strings.outputs.build-output-dir }}/api
        # ls ${{ steps.strings.outputs.py-bin-dir }}


    - name: Get Binaries (macOS)
      if: matrix.os == 'macOS-latest'
      run: |
        cp ${{ steps.strings.outputs.build-output-dir }}/coretrace/simdriver/simdriver ${{ steps.strings.outputs.py-bin-dir }}
        cp ${{ steps.strings.outputs.build-output-dir }}/api/stapi_v2.dylib ${{ steps.strings.outputs.py-bin-dir }}

    - name: Get Binaries (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cp ${{ steps.strings.outputs.build-output-dir }}/coretrace/simdriver/simdriver ${{ steps.strings.outputs.py-bin-dir }}
        cp ${{ steps.strings.outputs.build-output-dir }}/api/stapi_v2.so ${{ steps.strings.outputs.py-bin-dir }}

    # python specific steps for building the wheel, need to copy files from build, need to make venv
    - uses: actions/setup-python@v6
      with:
          python-version: '3.14'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
        python -m pip install hatchling==1.32.4

    - name: Build wheel
      working-directory: ${{ github.workspace }}/api/pysoltrace
      run: python -m build --wheel

    - uses: actions/upload-artifact@v6
      with:
        name: pysoltrace-wheels-${{ matrix.os }}
        path: ${{ github.workspace }}/api/pysoltrace/dist/*.whl
        if-no-files-found: error

  # job to test pysoltrace wheels on different OSs and different python versions
  # made seperate steps so it isn't compiled all the time
  test-wheel:
    needs: build-wheel

    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download wheel artifacts
      uses: actions/download-artifact@v5
      with:
        pattern: pysoltrace-wheels-${{ matrix.os }}
        path: ${{ github.workspace }}/dist/
        merge-multiple: true

    - name: Set up testing environment
      run: |
        ls ${{ github.workspace }}/dist/
        mkdir testing
        cp ${{ github.workspace }}/api/pysoltrace/testing.py ./testing
        cd ./testing
        python -m venv .venv

    - name : Activate virtual environment (Ubuntu/MacOS)
      if: matrix.os != 'windows-latest'
      working-directory: ./testing
      run: > 
        source .venv/bin/activate

    - name : Activate virtual environment (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: ./testing
      run: > 
        .venv/bin/activate

    - name: Install/test wheel
      working-directory: ./testing
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ${{ github.workspace }}/api/requirements.txt
        python -m pip install --no-index --find-links=${{ github.workspace }}/dist/ pysoltrace
        python ./testing.py -v
