name: GUI Release

on:
  # Manual runs are useful while iterating on packaging from a feature branch.
  workflow_dispatch:
  # Tag pushes are the release path. Assets are uploaded to a draft release
  # named after the tag.
  push:
    tags:
      - "v*.*.*"

permissions:
  # Needed by `gh release create/upload` below.
  contents: write

env:
  BUILD_TYPE: Release
  APP_VERSION: "4.0.0"
  QT_VERSION: "6.11.1"
  # Keep Embree pinned independently from Qt. The workflow expects the upstream
  # release assets to include CMake package files under lib/cmake/embree-X.Y.Z.
  EMBREE_VERSION: "4.4.1"
  CUDA_VERSION: "12.6.1"
  WIX_VERSION: "4.0.6"
  OPTIX_DEV_REF: "f1f6dd803f3159992d248178f6e09421c6eb8b6d"
  APP_NAME: SolTrace

jobs:
  test-release-tools:
    name: Test release tooling
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run release-tool unit tests
        run: python -m unittest discover -s scripts/release/tests -v

  bundle:
    name: ${{ matrix.name }}
    needs: test-release-tools
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_DIR: ${{ github.workspace }}/build
      INSTALL_DIR: ${{ github.workspace }}/dist
      ASSET_PATH: ${{ github.workspace }}/${{ matrix.asset_name }}
      MSI_ASSET_PATH: ${{ github.workspace }}/${{ matrix.msi_name }}

    strategy:
      # Let one platform fail without cancelling the rest. Packaging failures
      # tend to be platform-specific, especially while adding new bundle types.
      fail-fast: false
      matrix:
        # Each row is a complete Embree-enabled artifact flavor. Embree is the
        # supported release path going forward.
        include:
          - name: macOS ARM64 Embree bundle
            id: macos-arm64-embree
            platform: macos
            runner: macos-15
            qt_host: mac
            qt_arch: clang_64
            qt_modules: qtgraphs qtquick3d qtquicktimeline qtshadertools
            aqt_version: "==3.3.*"
            aqt_source: ""
            cmake_extra: >-
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
            embree_enabled: "ON"
            optix_enabled: "OFF"
            msi_enabled: "OFF"
            msi_package_name: ""
            msi_install_directory: ""
            msi_upgrade_guid: ""
            # RenderKit's written installation directions still name only the
            # older x86_64 archive, but the v4.4.1 release also publishes an ARM
            # archive. Select that release asset without hardcoding its full name.
            embree_asset_regex: ".*(arm64|aarch64|universal).*mac(osx|os)?.*\\.zip$"
            artifact_name: SolTrace-macOS-ARM64-Embree
            asset_name: SolTrace-macOS-arm64-Embree.zip
            msi_name: ""

          - name: Windows x64 Embree bundle
            id: windows-x64-embree
            platform: windows
            runner: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2022_64
            qt_modules: all
            aqt_version: ""
            aqt_source: git+https://github.com/miurahr/aqtinstall.git@master
            cmake_extra: ""
            embree_enabled: "ON"
            optix_enabled: "OFF"
            msi_enabled: "ON"
            msi_package_name: SolTrace
            msi_install_directory: SolTrace
            msi_upgrade_guid: 4F2CA469-A426-5378-BB8C-4E6EA7A23702
            # RenderKit's Windows binary archive is expected to contain the DLLs
            # and bundled CMake config used by find_package(embree 4 REQUIRED).
            embree_asset_regex: ".*x64.*windows.*\\.zip$"
            artifact_name: SolTrace-Windows-x64-Embree
            asset_name: SolTrace-Windows-x64-Embree.zip
            msi_name: SolTrace-Windows-x64-Embree.msi

          - name: Linux x64 Embree AppImage
            id: linux-x64-embree
            platform: linux
            runner: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_modules: all
            aqt_version: "==3.3.*"
            aqt_source: ""
            cmake_extra: ""
            embree_enabled: "ON"
            optix_enabled: "OFF"
            msi_enabled: "OFF"
            msi_package_name: ""
            msi_install_directory: ""
            msi_upgrade_guid: ""
            # Linux Embree archives are expected to be tarballs. The regex is
            # intentionally broad across x64/x86_64 spelling.
            embree_asset_regex: ".*(x86_64|x64).*linux.*\\.(tar\\.gz|tgz)$"
            artifact_name: SolTrace-Linux-x64-Embree
            asset_name: SolTrace-Linux-x86_64-Embree.AppImage
            msi_name: ""

          - name: Windows x64 Embree OptiX bundle
            id: windows-x64-embree-optix
            platform: windows
            runner: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2022_64
            qt_modules: all
            aqt_version: ""
            aqt_source: git+https://github.com/miurahr/aqtinstall.git@master
            cmake_extra: >-
              -G "Visual Studio 17 2022" -A x64
              -DSOLTRACE_OPTIX_COMPUTE_CAPABILITY=75
            embree_enabled: "ON"
            optix_enabled: "ON"
            msi_enabled: "ON"
            msi_package_name: SolTrace OptiX
            msi_install_directory: SolTrace OptiX
            msi_upgrade_guid: D4AB6CD5-6276-5377-8E41-53D1DE59BD33
            embree_asset_regex: ".*x64.*windows.*\\.zip$"
            artifact_name: SolTrace-Windows-x64-Embree-OptiX
            asset_name: SolTrace-Windows-x64-Embree-OptiX.zip
            msi_name: SolTrace-Windows-x64-Embree-OptiX.msi

          - name: Linux x64 Embree OptiX AppImage
            id: linux-x64-embree-optix
            platform: linux
            runner: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_modules: all
            aqt_version: "==3.3.*"
            aqt_source: ""
            cmake_extra: -DSOLTRACE_OPTIX_COMPUTE_CAPABILITY=75
            embree_enabled: "ON"
            optix_enabled: "ON"
            msi_enabled: "OFF"
            msi_package_name: ""
            msi_install_directory: ""
            msi_upgrade_guid: ""
            embree_asset_regex: ".*(x86_64|x64).*linux.*\\.(tar\\.gz|tgz)$"
            artifact_name: SolTrace-Linux-x64-Embree-OptiX
            asset_name: SolTrace-Linux-x86_64-Embree-OptiX.AppImage
            msi_name: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up release Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WiX Toolset
        if: matrix.msi_enabled == 'ON'
        shell: pwsh
        run: |
          $wixToolDir = Join-Path $env:RUNNER_TEMP "wix"
          dotnet tool install --tool-path $wixToolDir wix --version "${{ env.WIX_VERSION }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $wixToolDir "wix.exe") extension add --global "WixToolset.UI.wixext/${{ env.WIX_VERSION }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WIX=$wixToolDir" >> $env:GITHUB_ENV
          "$wixToolDir" >> $env:GITHUB_PATH

      - name: Checkout OptiX headers
        if: matrix.optix_enabled == 'ON'
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/optix-dev
          ref: ${{ env.OPTIX_DEV_REF }}
          path: optix-dev

      - name: Install Qt
        if: matrix.aqt_version != ''
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: ${{ matrix.aqt_version }}
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}

      - name: Install CUDA Toolkit
        if: matrix.optix_enabled == 'ON'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          linux-local-args: '["--toolkit"]'
          log-file-suffix: '${{ matrix.id }}.txt'

      - name: Install Qt using aqt master
        # Windows Qt 6.11 needs an aqt fix that has not reached a release yet.
        if: matrix.aqt_source != ''
        uses: jurplel/install-qt-action@v4
        with:
          aqtsource: ${{ matrix.aqt_source }}
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            libgl1-mesa-dev \
            libtiff5 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            imagemagick \
            patchelf

      - name: Install Embree
        if: matrix.embree_enabled == 'ON'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.release.release_tools install-embree
          --version "${{ env.EMBREE_VERSION }}"
          --asset-regex '${{ matrix.embree_asset_regex }}'
          --runner-temp "${{ runner.temp }}"

      - name: Configure
        run: >
          cmake -S "${{ github.workspace }}"
          -B "${{ env.BUILD_DIR }}"
          -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"
          -DSOLTRACE_BUILD_GUI=ON
          -DSOLTRACE_BUILD_TESTS=OFF
          -DSOLTRACE_BUILD_EMBREE_SUPPORT=${{ matrix.embree_enabled }}
          -DSOLTRACE_BUILD_OPTIX_SUPPORT=${{ matrix.optix_enabled }}
          -DOptiX_INSTALL_DIR="${{ github.workspace }}/optix-dev"
          -DQT_QML_NO_CACHEGEN=ON
          ${{ matrix.cmake_extra }}

      - name: Build
        run: >
          cmake --build "${{ env.BUILD_DIR }}"
          --target "${{ env.APP_NAME }}"
          --config "${{ env.BUILD_TYPE }}"
          --verbose

      - name: Build installable support tools
        run: >
          cmake --build "${{ env.BUILD_DIR }}"
          --target simdriver
          --config "${{ env.BUILD_TYPE }}"
          --verbose

      - name: Install bundle
        run: >
          cmake --install "${{ env.BUILD_DIR }}"
          --config "${{ env.BUILD_TYPE }}"
          --prefix "${{ env.INSTALL_DIR }}"

      - name: Stage non-Qt runtime libraries
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        run: >-
          python -m scripts.release.release_tools stage-runtime
          --platform "${{ matrix.platform }}"
          --install-dir "${{ env.INSTALL_DIR }}"
          --app-name "${{ env.APP_NAME }}"
          --optix-enabled "${{ matrix.optix_enabled }}"

      - name: Bundle license files
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.release.release_tools bundle-licenses
          --platform "${{ matrix.platform }}"
          --workspace "${{ github.workspace }}"
          --build-dir "${{ env.BUILD_DIR }}"
          --install-dir "${{ env.INSTALL_DIR }}"
          --app-name "${{ env.APP_NAME }}"
          --optix-enabled "${{ matrix.optix_enabled }}"

      - name: Ad-hoc sign macOS bundle
        if: matrix.platform == 'macos'
        run: >-
          python -m scripts.release.release_tools sign-macos
          --install-dir "${{ env.INSTALL_DIR }}"
          --app-name "${{ env.APP_NAME }}"

      - name: Validate staged bundle
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        run: >-
          python -m scripts.release.release_tools validate
          --platform "${{ matrix.platform }}"
          --install-dir "${{ env.INSTALL_DIR }}"
          --app-name "${{ env.APP_NAME }}"
          --optix-enabled "${{ matrix.optix_enabled }}"

      - name: Package release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.release.release_tools package
          --platform "${{ matrix.platform }}"
          --workspace "${{ github.workspace }}"
          --build-dir "${{ env.BUILD_DIR }}"
          --install-dir "${{ env.INSTALL_DIR }}"
          --asset "${{ env.ASSET_PATH }}"
          --app-name "${{ env.APP_NAME }}"
          --optix-enabled "${{ matrix.optix_enabled }}"

      - name: Package Windows MSI
        if: matrix.msi_enabled == 'ON'
        run: >-
          python -m scripts.release.release_tools package-windows-msi
          --workspace "${{ github.workspace }}"
          --build-dir "${{ env.BUILD_DIR }}"
          --install-dir "${{ env.INSTALL_DIR }}"
          --installer-root "${{ github.workspace }}/installer-root"
          --asset "${{ env.MSI_ASSET_PATH }}"
          --app-name "${{ env.APP_NAME }}"
          --package-name "${{ matrix.msi_package_name }}"
          --install-directory "${{ matrix.msi_install_directory }}"
          --package-version "${{ env.APP_VERSION }}"
          --upgrade-guid "${{ matrix.msi_upgrade_guid }}"

      - name: Upload packaged workflow artifact
        if: matrix.platform != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

      # upload-artifact always creates a ZIP. Uploading our Windows ZIP would
      # therefore produce a ZIP containing another ZIP in manual workflow runs.
      # The staged tree is safe to archive directly on Windows; tagged releases
      # still publish ASSET_PATH below as the intentionally packaged ZIP.
      - name: Upload Windows workflow artifact contents
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error

      - name: Upload Windows installer artifact
        if: matrix.msi_enabled == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-Installer
          path: ${{ env.MSI_ASSET_PATH }}
          if-no-files-found: error

      - name: Publish draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.release.release_tools publish
          --tag "${{ github.ref_name }}"
          --asset "${{ env.ASSET_PATH }}"

      - name: Publish Windows installer to draft release
        if: matrix.msi_enabled == 'ON' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.release.release_tools publish
          --tag "${{ github.ref_name }}"
          --asset "${{ env.MSI_ASSET_PATH }}"
